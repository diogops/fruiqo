name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    # SEC-REQ-10: nenhum segredo de terceiro no repositório/bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dev_postgres_password
          POSTGRES_DB: fruiqo
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d fruiqo"
          --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Role da aplicação (mesmo papel de infra/postgres/init.sql)
        run: PGPASSWORD=dev_postgres_password psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55432 -U postgres -d fruiqo -f infra/postgres/init.sql
      - run: pnpm build:packages
      # RF-21: repositório público, então fixtures/ só pode ter conteúdo sintético
      - run: pnpm fixtures:check
      - run: pnpm typecheck
      - run: pnpm test
      # RF-30: sistema web (Vite) precisa compilar
      - run: pnpm --filter @fruiqo/web build
      # RF-22 / RNF-07: pipeline em PIPELINE_MODE=mock com a rede bloqueada; falha em regressão
      # contra a baseline v1-review-txt ou recall de risco < 100%
      - run: pnpm eval --check --label ci
      # SEC-REQ-24: bloqueia CVE crítica em dependências
      - run: pnpm audit --audit-level critical --prod
